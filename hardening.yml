- name: Harden Ubuntu server
  hosts: ubuntu
  become: true
  tasks:
    # --- Packages ---
    - name: Update all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist

    - name: Install security packages
      ansible.builtin.apt:
        name:
          - ufw
          - fail2ban
          - unattended-upgrades
          - auditd
          - lynis
        state: present

    # install_recommends is off so rkhunter doesn't pull in a mail server (postfix)
    # aide-common provides /etc/aide/aide.conf and the aideinit wrapper
    - name: Install extra security tools
      ansible.builtin.apt:
        name:
          - rkhunter
          - aide
          - aide-common
          - debsums
          - debsecan
          - apt-show-versions
          - apt-listchanges
          - libpam-tmpdir
          - libpam-pwquality
        state: present
        install_recommends: false

    - name: Initialize AIDE database (takes a few minutes)
      ansible.builtin.command: aideinit -y -f
      args:
        creates: /var/lib/aide/aide.db

    # --- SSH ---
    # Use a drop-in file with a 00- prefix because sshd uses the first value it
    # finds, so this must be read before other files (e.g. 50-cloud-init.conf)
    - name: Configure SSH hardening
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        mode: '0644'
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          PubkeyAuthentication yes
          PermitEmptyPasswords no
          MaxAuthTries 3
          MaxSessions 2
          X11Forwarding no
          AllowTcpForwarding no
          AllowAgentForwarding no
          TCPKeepAlive no
          LogLevel VERBOSE
          ClientAliveInterval 300
          ClientAliveCountMax 2
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart ssh

    # --- Firewall ---
    - name: Allow SSH with rate limiting
      community.general.ufw:
        rule: limit
        port: '22'
        proto: tcp

    - name: Enable ufw and deny incoming by default
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    # --- Kernel ---
    - name: Apply sysctl hardening
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/99-hardening.conf
        reload: true
      loop:
        - { key: net.ipv4.tcp_syncookies, value: '1' }
        - { key: net.ipv4.conf.all.rp_filter, value: '1' }
        - { key: net.ipv4.conf.all.accept_redirects, value: '0' }
        - { key: net.ipv4.conf.all.send_redirects, value: '0' }
        - { key: net.ipv4.conf.all.accept_source_route, value: '0' }
        - { key: net.ipv4.icmp_echo_ignore_broadcasts, value: '1' }
        - { key: net.ipv4.conf.all.log_martians, value: '1' }
        - { key: kernel.dmesg_restrict, value: '1' }
        - { key: kernel.kptr_restrict, value: '2' }
        - { key: fs.suid_dumpable, value: '0' }

    - name: Disable unused network protocols and USB storage
      ansible.builtin.copy:
        dest: /etc/modprobe.d/hardening-blacklist.conf
        mode: '0644'
        content: |
          install dccp /bin/true
          install sctp /bin/true
          install rds /bin/true
          install tipc /bin/true
          install usb-storage /bin/true

    # --- fail2ban ---
    - name: Create fail2ban jail.local so updates don't overwrite config
      ansible.builtin.copy:
        src: /etc/fail2ban/jail.conf
        dest: /etc/fail2ban/jail.local
        remote_src: true
        force: false
        mode: '0644'
      notify: Restart fail2ban

    # --- Password policy ---
    - name: Harden /etc/login.defs
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: "^#?\\s*{{ item.key }}\\s"
        line: "{{ item.key }}   {{ item.value }}"
      loop:
        - { key: PASS_MAX_DAYS, value: '365' }
        - { key: PASS_MIN_DAYS, value: '1' }
        - { key: UMASK, value: '027' }

    # --- Core dumps ---
    - name: Disable core dumps
      ansible.builtin.lineinfile:
        path: /etc/security/limits.conf
        line: '* hard core 0'
        insertbefore: '^# End of file'

    # --- Banners ---
    - name: Set legal banner
      ansible.builtin.copy:
        dest: "{{ item }}"
        mode: '0644'
        content: |
          Authorized access only. All activity may be monitored and logged.
      loop:
        - /etc/issue
        - /etc/issue.net

    # --- Audit rules (auditd was running with an empty ruleset) ---
    - name: Add basic audit rules
      ansible.builtin.copy:
        dest: /etc/audit/rules.d/99-hardening.rules
        mode: '0640'
        content: |
          -w /etc/passwd -p wa -k identity
          -w /etc/shadow -p wa -k identity
          -w /etc/group -p wa -k identity
          -w /etc/sudoers -p wa -k sudoers
          -w /etc/sudoers.d/ -p wa -k sudoers
          -w /etc/ssh/sshd_config -p wa -k sshd
          -w /etc/ssh/sshd_config.d/ -p wa -k sshd
          -w /var/log/auth.log -p wa -k authlog
      notify: Reload audit rules

    # --- Services ---
    # ignore_errors only applies in --check mode, where packages aren't really installed
    - name: Enable and start fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Enable and start auditd
      ansible.builtin.service:
        name: auditd
        state: started
        enabled: true
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Enable automatic security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: '0644'
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted

    - name: Restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted

    - name: Reload audit rules
      ansible.builtin.command: augenrules --load
